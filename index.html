const CursoProbidad = ({ sesion }) => {
    const [currentView, setCurrentView] = useState('registration');
    const [userData, setUserData] = useState({
        name: sesion.user.user_metadata.full_name || sesion.user.user_metadata.name || sesion.user.email,
        rut: ''
    });
    const [formErrors, setFormErrors] = useState({});
    const [guardando, setGuardando] = useState(false);
    const [activeModule, setActiveModule] = useState(0);
    const [currentQIndex, setCurrentQIndex] = useState(0);
    const [userAnswers, setUserAnswers] = useState([]);
    const [score, setScore] = useState(0);
    const [showExp, setShowExp] = useState(false);
    const scrollRef = useRef(null);

    useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' });
    }, [activeModule, currentQIndex, currentView]);

    const validateForm = () => {
        const errors = {};
        if (!userData.rut.trim()) {
            errors.rut = 'El RUT es obligatorio.';
        } else if (!/^[0-9]+-[0-9kK]{1}$/.test(userData.rut)) {
            errors.rut = 'El RUT debe tener formato válido (ej: 12345678-9).';
        }
        setFormErrors(errors);
        return Object.keys(errors).length === 0;
    };

    // Guarda la inscripción en Supabase. La política de la base de datos
    // (ver esquema-supabase.sql) exige además que el correo de la sesión
    // termine en el dominio institucional, así que esto falla igual si
    // alguien intenta forzarlo con una cuenta ajena.
    const guardarInscripcion = async () => {
        setGuardando(true);
        await supabase.from('inscripciones').upsert({
            user_id: sesion.user.id,
            curso_id: CURSO_PROBIDAD_ID,
            email: sesion.user.email,
            nombre: userData.name,
            rut: userData.rut,
            iniciado_en: new Date().toISOString()
        }, { onConflict: 'user_id,curso_id' });
        setGuardando(false);
    };

    const guardarCertificado = async (puntaje, aprobado) => {
        await supabase.from('certificados').upsert({
            user_id: sesion.user.id,
            curso_id: CURSO_PROBIDAD_ID,
            email: sesion.user.email,
            nombre: userData.name,
            rut: userData.rut,
            puntaje: puntaje,
            aprobado: aprobado,
            emitido_en: new Date().toISOString()
        }, { onConflict: 'user_id,curso_id' });
    };

    const handleRegistrationSubmit = async (e) => {
        e.preventDefault();
        if (validateForm()) {
            await guardarInscripcion();
            setCurrentView('welcome');
        }
    };

    const handleStartCourse = () => {
        setCurrentView('modules');
        setActiveModule(-1);
    };

    const nextModule = () => {
        if (activeModule < modulesData.length - 1) {
            setActiveModule(activeModule + 1);
        } else {
            setCurrentView('quiz');
            setCurrentQIndex(0);
            setUserAnswers([]);
            setScore(0);
            setShowExp(false);
        }
    };

    const prevModule = () => {
        if (activeModule > -1) setActiveModule(activeModule - 1);
    };

    const handleAnswerSelection = (optionIndex) => {
        if (showExp) return;

        const isCorrect = optionIndex === quizQuestions[currentQIndex].correct;
        if (isCorrect) setScore(score + 1);

        const newAnswers = [...userAnswers];
        newAnswers[currentQIndex] = optionIndex;
        setUserAnswers(newAnswers);
        setShowExp(true);
    };

    const nextQuestion = () => {
        setShowExp(false);
        if (currentQIndex < quizQuestions.length - 1) {
            setCurrentQIndex(currentQIndex + 1);
        } else {
            setCurrentView('results');
            const percentage = Math.round((score / quizQuestions.length) * 100);
            guardarCertificado(percentage, percentage >= 80);
        }
    };

    const renderRegistration = () => (
        <div className="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center slide-up w-full max-w-md mx-auto">
            <div className="bg-white p-8 rounded-3xl shadow-2xl border border-gray-100 w-full relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
                <h2 className="text-2xl font-bold text-gray-800 mb-2">Confirma tus datos</h2>
                <p className="text-gray-500 text-sm mb-6">Sesión iniciada como <strong>{sesion.user.email}</strong>. Solo falta tu RUT para emitir el certificado.</p>

                <form onSubmit={handleRegistrationSubmit} className="space-y-5 text-left">
                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo</label>
                        <input type="text" value={userData.name} readOnly className="w-full px-4 py-3 rounded-xl border border-gray-200 bg-gray-100 text-gray-500" />
                        <p className="text-xs text-gray-400 mt-1">Este nombre viene de tu cuenta de Google institucional.</p>
                    </div>
                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-1">RUT (sin puntos, con guion)</label>
                        <input type="text" value={userData.rut} onChange={(e) => setUserData({...userData, rut: e.target.value})} placeholder="Ej: 12345678-9" className={`w-full px-4 py-3 rounded-xl border ${formErrors.rut ? 'border-red-500' : 'border-gray-300'} focus:ring-2 focus:border-blue-500`} />
                        {formErrors.rut && <p className="text-red-500 text-xs mt-1">{formErrors.rut}</p>}
                    </div>
                    <button type="submit" disabled={guardando} className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl mt-4 disabled:opacity-60">
                        {guardando ? 'Guardando…' : <>Continuar <i className="fa-solid fa-arrow-right ml-2"></i></>}
                    </button>
                </form>
            </div>
        </div>
    );

    const renderWelcome = () => (
        <div className="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center slide-up">
            <h1 className="text-4xl font-extrabold text-gray-800 mb-2">Probidad en el Estado de Chile</h1>
            <p className="text-blue-600 font-semibold mb-6">Bienvenido/a, {userData.name}</p>
            <p className="text-xl text-gray-600 max-w-3xl mb-8">El curso cuenta con un <strong>Video Principal</strong> obligatorio y 7 módulos complementarios sobre el deber de abstención, la DIP y las normativas de Contraloría.</p>
            <button onClick={handleStartCourse} className="bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 px-10 rounded-full">Comenzar Curso <i className="fa-solid fa-play ml-2"></i></button>
        </div>
    );

    const renderModules = () => {
        if (activeModule === -1) {
            return (
                <div className="max-w-4xl mx-auto w-full slide-up">
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-8">
                        <h2 className="text-2xl font-bold text-gray-800 mb-4"><i className="fa-brands fa-youtube text-red-600 mr-2"></i> Clase Magistral: Probidad y Conflictos de Intereses</h2>
                        <div className="bg-black rounded-xl overflow-hidden relative" style={{ paddingBottom: '56.25%', height: 0 }}>
                            <iframe className="absolute top-0 left-0 w-full h-full" src={VIDEO_URL} frameBorder="0" allowFullScreen></iframe>
                        </div>
                        <div className="mt-8 flex justify-end">
                            <button onClick={nextModule} className="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold">Continuar a Módulos Complementarios <i className="fa-solid fa-arrow-right ml-2"></i></button>
                        </div>
                    </div>
                </div>
            );
        }

        const mod = modulesData[activeModule];
        const progress = ((activeModule + 1) / modulesData.length) * 100;

        return (
            <div className="max-w-4xl mx-auto w-full slide-up">
                <div className="mb-8">
                    <div className="w-full bg-gray-200 rounded-full h-3"><div className="bg-blue-600 h-3 rounded-full" style={{ width: `${progress}%` }}></div></div>
                </div>
                <div className="bg-white rounded-2xl shadow-xl border border-gray-100">
                    <div className="bg-slate-800 p-6 flex items-center gap-4">
                        <div className="bg-white/20 p-3 rounded-lg text-white"><i className={`fa-solid ${mod.icon} text-3xl`}></i></div>
                        <h2 className="text-2xl font-bold text-white">{mod.title}</h2>
                    </div>
                    <div className="p-8 space-y-6">
                        <p className="text-gray-700 text-lg whitespace-pre-line">{mod.theory}</p>
                        <div className="bg-blue-50 border-l-4 border-blue-500 p-4"><p className="text-blue-900 italic">" {mod.application} "</p></div>
                        <div className="bg-amber-50 border border-amber-200 p-4 flex gap-4">
                            <i className="fa-solid fa-triangle-exclamation text-amber-500 text-2xl"></i>
                            <p className="text-amber-900 text-sm">{mod.caiggAlert}</p>
                        </div>
                    </div>
                    <div className="bg-gray-50 p-5 flex justify-between">
                        <button onClick={prevModule} className="text-blue-600 font-semibold"><i className="fa-solid fa-arrow-left mr-2"></i> Anterior</button>
                        <button onClick={nextModule} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">{activeModule === modulesData.length - 1 ? 'Iniciar Evaluación' : 'Siguiente'} <i className="fa-solid fa-arrow-right ml-2"></i></button>
                    </div>
                </div>
            </div>
        );
    };

    const renderQuiz = () => {
        const q = quizQuestions[currentQIndex];
        const hasAnswered = showExp;
        const isUserCorrect = userAnswers[currentQIndex] === q.correct;

        return (
            <div className="max-w-3xl mx-auto w-full slide-up">
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-8">
                    <h2 className="text-2xl font-bold text-gray-800 mb-6 leading-relaxed">
                        {q.q}
                    </h2>

                    <div className="space-y-4 mb-8">
                        {q.options.map((opt, idx) => {
                            let btnStyle = "border-gray-200 text-gray-700 hover:border-indigo-400 hover:bg-indigo-50";
                            let icon = null;

                            // Si ya respondió, solo aplicamos colores a LA OPCIÓN QUE ÉL ELIGIÓ
                            // para que NO sepa cuál es la correcta si se equivoca.
                            if (hasAnswered) {
                                if (idx === userAnswers[currentQIndex]) {
                                    if (idx === q.correct) {
                                        btnStyle = "border-green-500 bg-green-50 text-green-800 ring-2 ring-green-500 shadow-sm";
                                        icon = <i className="fa-solid fa-circle-check text-green-600 text-xl"></i>;
                                    } else {
                                        btnStyle = "border-red-500 bg-red-50 text-red-800 ring-2 ring-red-500 shadow-sm";
                                        icon = <i className="fa-solid fa-circle-xmark text-red-600 text-xl"></i>;
                                    }
                                } else {
                                    btnStyle = "border-gray-200 text-gray-400 opacity-50 cursor-not-allowed";
                                }
                            }

                            return (
                                <button
                                    key={idx}
                                    onClick={() => handleAnswerSelection(idx)}
                                    disabled={hasAnswered}
                                    className={`w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex justify-between items-center gap-4 ${btnStyle}`}
                                >
                                    <span className="leading-relaxed">{opt}</span>
                                    {icon}
                                </button>
                            );
                        })}
                    </div>

                    {hasAnswered && (
                        <div className={`p-5 rounded-lg mb-6 fade-in border-l-4 ${isUserCorrect ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
                            <h4 className={`font-bold mb-2 flex items-center ${isUserCorrect ? 'text-green-800' : 'text-red-800'}`}>
                                <i className={`fa-solid ${isUserCorrect ? 'fa-thumbs-up' : 'fa-circle-exclamation'} mr-2`}></i>
                                {isUserCorrect ? '¡Respuesta Correcta!' : 'Respuesta Incorrecta'}
                            </h4>
                            <p className="text-gray-700 text-sm leading-relaxed">
                                <strong>Información Relevante:</strong> {q.explanation}
                            </p>
                        </div>
                    )}

                    {hasAnswered && (
                        <div className="text-right border-t border-gray-100 pt-6">
                            <button
                                onClick={nextQuestion}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg font-bold shadow-md transition-all transform hover:-translate-y-0.5"
                            >
                                {currentQIndex === quizQuestions.length - 1 ? 'Ver Resultados Finales' : 'Siguiente Pregunta'} <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const renderResults = () => {
        const percentage = Math.round((score / quizQuestions.length) * 100);
        const passed = percentage >= 80;
        return (
            <div className="max-w-2xl mx-auto w-full text-center slide-up bg-white rounded-3xl shadow-2xl p-10">
                <h2 className="text-4xl font-extrabold mb-4">Resultados</h2>
                <div className={`text-6xl font-black mb-4 ${passed ? 'text-green-600' : 'text-red-600'}`}>{percentage}%</div>

                {passed ? (
                    <>
                        <p className="text-gray-600 mb-8 font-medium">¡Felicitaciones! Has demostrado un nivel de comprensión superior al 80% requerido.</p>
                        <button onClick={() => setCurrentView('certificate')} className="bg-green-600 text-white px-8 py-4 rounded-full font-bold"><i className="fa-solid fa-certificate mr-2"></i> Obtener Certificado</button>
                    </>
                ) : (
                    <>
                        <p className="text-red-600 mb-8 font-medium">Lamentablemente no has alcanzado el 80% mínimo de aprobación requerido para este curso obligatorio. Debes volver a realizarlo.</p>
                        <button onClick={() => { setCurrentView('modules'); setActiveModule(-1); setScore(0); setCurrentQIndex(0); setShowExp(false); }} className="bg-gray-800 text-white px-8 py-4 rounded-full font-bold"><i className="fa-solid fa-rotate-right mr-2"></i> Volver a Iniciar Curso</button>
                    </>
                )}
            </div>
        );
    };

    const renderCertificate = () => (
        <div className="w-full max-w-4xl mx-auto flex flex-col items-center slide-up pb-10">
            <div className="w-full flex justify-end mb-6 print-hidden">
                <button onClick={() => window.print()} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold shadow"><i className="fa-solid fa-print mr-2"></i> Imprimir / PDF</button>
            </div>
            <div id="certificate-print-area" className="w-full bg-white p-12 border-8 border-double border-blue-900 shadow-2xl text-center certificate-bg">
                <h1 className="text-5xl font-serif text-gray-800 mb-8 uppercase">Certificado de Aprobación</h1>
                <p className="text-gray-500 uppercase tracking-widest text-sm mb-12">Se otorga a:</p>
                <h2 className="text-4xl font-bold text-blue-900 mb-2">{userData.name.toUpperCase()}</h2>
                <p className="text-gray-600 font-medium mb-10 tracking-wider">RUT: {userData.rut}</p>
                <p className="text-lg text-gray-700 leading-relaxed mb-16">Por haber aprobado satisfactoriamente el curso avanzado de capacitación sobre la <strong>Ley 20.880 y Probidad en la Función Pública</strong>.</p>
                <div className="text-yellow-500 text-6xl drop-shadow-md"><i className="fa-solid fa-certificate"></i></div>
            </div>
        </div>
    );

    return (
        <div className="min-h-screen flex flex-col h-screen overflow-hidden">
            <header className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center print-hidden">
                <a href="#/" className="font-bold hover:text-blue-300"><i className="fa-solid fa-arrow-left mr-2"></i>Portal de Capacitación</a>
                <span className="text-sm bg-slate-800 px-3 py-1 rounded-full">{sesion.user.email}</span>
            </header>
            <main ref={scrollRef} className="flex-grow overflow-y-auto p-4 md:p-8 flex items-start justify-center scrollbar-hide">
                {currentView === 'registration' && renderRegistration()}
                {currentView === 'welcome' && renderWelcome()}
                {currentView === 'modules' && renderModules()}
                {currentView === 'quiz' && renderQuiz()}
                {currentView === 'results' && renderResults()}
                {currentView === 'certificate' && renderCertificate()}
            </main>
        </div>
    );
};

// VISTA: PANEL DE ADMINISTRADOR
// ============================================================
const PanelAdmin = ({ sesion }) => {
    const [estado, setEstado] = useState("verificando"); // verificando | sin-acceso | listo
    const [inscripciones, setInscripciones] = useState([]);
    const [certificados, setCertificados] = useState([]);
    const [filtroCurso, setFiltroCurso] = useState("todos");

    useEffect(() => {
        (async () => {
            const { data: perfil } = await supabase
                .from("perfiles")
                .select("es_admin")
                .eq("id", sesion.user.id)
                .single();

            if (!perfil || !perfil.es_admin) {
                setEstado("sin-acceso");
                return;
            }

            const [{ data: insc }, { data: certs }] = await Promise.all([
                supabase.from("inscripciones").select("*").order("iniciado_en", { ascending: false }),
                supabase.from("certificados").select("*").order("emitido_en", { ascending: false })
            ]);
            setInscripciones(insc || []);
            setCertificados(certs || []);
            setEstado("listo");
        })();
    }, []);

    if (estado === "verificando") {
        return <div className="min-h-screen flex items-center justify-center text-gray-400">Verificando acceso…</div>;
    }

    if (estado === "sin-acceso") {
        return (
            <div className="min-h-screen flex items-center justify-center p-6">
                <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md text-center">
                    <div className="text-red-500 text-4xl mb-4"><i className="fa-solid fa-lock"></i></div>
                    <h1 className="text-xl font-bold mb-2">Sin acceso de administrador</h1>
                    <p className="text-gray-500 mb-6">Tu cuenta no tiene permisos para ver este panel.</p>
                    <a href="#/" className="text-blue-600 font-semibold"><i className="fa-solid fa-arrow-left mr-2"></i>Volver al portal</a>
                </div>
            </div>
        );
    }

    const cursosConDatos = [...new Set(inscripciones.map(i => i.curso_id))];
    const inscFiltradas = filtroCurso === "todos" ? inscripciones : inscripciones.filter(i => i.curso_id === filtroCurso);

    const certificadoDe = (userId, cursoId) =>
        certificados.find(c => c.user_id === userId && c.curso_id === cursoId);

    return (
        <div className="min-h-screen">
            <header className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
                <a href="#/" className="font-bold hover:text-blue-300"><i className="fa-solid fa-arrow-left mr-2"></i>Panel de Administrador</a>
            </header>

            <main className="max-w-6xl mx-auto p-6 md:p-10">
                <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                    <h2 className="text-2xl font-bold text-gray-800">Inscritos y certificados</h2>
                    <select value={filtroCurso} onChange={e => setFiltroCurso(e.target.value)} className="border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        <option value="todos">Todos los cursos</option>
                        {cursosConDatos.map(id => <option key={id} value={id}>{nombreCurso(id)}</option>)}
                    </select>
                </div>

                <div className="bg-white rounded-2xl shadow-md overflow-x-auto">
                    <table className="w-full text-sm">
                        <thead className="bg-gray-50 text-gray-500 uppercase text-xs">
                            <tr>
                                <th className="text-left px-4 py-3">Nombre</th>
                                <th className="text-left px-4 py-3">Correo</th>
                                <th className="text-left px-4 py-3">RUT</th>
                                <th className="text-left px-4 py-3">Curso</th>
                                <th className="text-left px-4 py-3">Inscrito</th>
                                <th className="text-left px-4 py-3">Resultado</th>
                            </tr>
                        </thead>
                        <tbody>
                            {inscFiltradas.map(i => {
                                const cert = certificadoDe(i.user_id, i.curso_id);
                                return (
                                    <tr key={i.id} className="border-t border-gray-100">
                                        <td className="px-4 py-3 font-medium text-gray-800">{i.nombre}</td>
                                        <td className="px-4 py-3 text-gray-500">{i.email}</td>
                                        <td className="px-4 py-3 text-gray-500">{i.rut}</td>
                                        <td className="px-4 py-3 text-gray-500">{nombreCurso(i.curso_id)}</td>
                                        <td className="px-4 py-3 text-gray-500">{new Date(i.iniciado_en).toLocaleDateString("es-CL")}</td>
                                        <td className="px-4 py-3">
                                            {!cert && <span className="text-gray-400">En curso</span>}
                                            {cert && cert.aprobado && <span className="text-green-600 font-semibold"><i className="fa-solid fa-circle-check mr-1"></i>Aprobado ({cert.puntaje}%)</span>}
                                            {cert && !cert.aprobado && <span className="text-red-500 font-semibold"><i className="fa-solid fa-circle-xmark mr-1"></i>Reprobado ({cert.puntaje}%)</span>}
                                        </td>
                                    </tr>
                                );
                            })}
                            {inscFiltradas.length === 0 && (
                                <tr><td colSpan="6" className="px-4 py-10 text-center text-gray-400">Aún no hay inscritos.</td></tr>
                            )}
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    );
};

            )}

            <button onClick={onIngresar} className="w-full flex items-center justify-center gap-3 border-2 border-gray-200 hover:border-gray-300 rounded-xl py-3 font-semibold text-gray-700 transition-colors">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35 26.8 36 24 36c-5.4 0-9.9-3.4-11.5-8.2l-6.5 5C9.6 39.5 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C39.9 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
                Ingresar con Google
            </button>
            <p className="text-xs text-gray-400 mt-6">Acceso exclusivo para funcionarios con correo @{DOMINIO}</p>
        </div>
    </div>
);

// ============================================================
// APLICACIÓN: sesión + navegación interna por hash
//   #/                      → portal
//   #/curso/probidad-2026   → curso
//   #/admin                 → panel de administrador
// ============================================================
function leerRuta() {
    const h = (window.location.hash || "").replace(/^#/, "");
    if (h.startsWith("/curso/")) {
        const id = h.slice("/curso/".length);
        if (CURSOS_COMPONENTES[id]) return { vista: "curso", cursoId: id };
        return { vista: "portal" };
    }
    if (h === "/admin") return { vista: "admin" };
    return { vista: "portal" };
}

const App = () => {
    const [cargando, setCargando] = useState(true);
    const [sesion, setSesion] = useState(null);
    const [errorDominio, setErrorDominio] = useState(false);
    const [esAdmin, setEsAdmin] = useState(false);
    const [ruta, setRuta] = useState(leerRuta());

    useEffect(() => {
        const onHashChange = () => setRuta(leerRuta());
        window.addEventListener("hashchange", onHashChange);
        return () => window.removeEventListener("hashchange", onHashChange);
    }, []);

    useEffect(() => {
        supabase.auth.getSession().then(({ data }) => {
            manejarSesion(data.session);
            setCargando(false);
        });

        const { data: listener } = supabase.auth.onAuthStateChange((_event, session) => {
            manejarSesion(session);
        });
        return () => listener.subscription.unsubscribe();
    }, []);

    const manejarSesion = async (session) => {
        if (!session) { setSesion(null); return; }

        const email = session.user.email || "";
        if (!esCorreoValido(email)) {
            // Defensa en el cliente. La defensa real está en la base de datos
            // (ver esquema-supabase.sql): esa cuenta jamás debería poder
            // guardar datos aunque alguien manipule este JavaScript.
            setErrorDominio(true);
            await supabase.auth.signOut();
            setSesion(null);
            return;
        }
        setErrorDominio(false);
        setSesion(session);

        await supabase.from("perfiles").upsert({
            id: session.user.id,
            email: email,
            nombre_completo: session.user.user_metadata.full_name || session.user.user_metadata.name || "",
            ultimo_ingreso: new Date().toISOString()
        });

        const { data: perfil } = await supabase.from("perfiles").select("es_admin").eq("id", session.user.id).single();
        setEsAdmin(!!(perfil && perfil.es_admin));
    };

    const iniciarSesion = async () => {
        setErrorDominio(false);
        await supabase.auth.signInWithOAuth({
            provider: "google",
            options: {
                // "hd" le pide a Google que solo muestre/permita cuentas de ese
                // dominio en el selector. Es una ayuda de UX, no una barrera de
                // seguridad real — por eso igual validamos en el cliente y en la BD.
                queryParams: { hd: DOMINIO, prompt: "select_account" },
                redirectTo: window.location.href.split("#")[0]
            }
        });
    };

    const cerrarSesion = async () => {
        await supabase.auth.signOut();
        setSesion(null);
        irA("#/");
    };

    if (cargando) {
        return <div className="min-h-screen flex items-center justify-center text-gray-400">Cargando…</div>;
    }

    if (!sesion) {
        return <Login errorDominio={errorDominio} onIngresar={iniciarSesion} />;
    }

    if (ruta.vista === "admin") {
        return <PanelAdmin sesion={sesion} />;
    }

    if (ruta.vista === "curso") {
        const Componente = CURSOS_COMPONENTES[ruta.cursoId];
        return <Componente key={ruta.cursoId} sesion={sesion} />;
    }

    return <Portal sesion={sesion} esAdmin={esAdmin} onCerrarSesion={cerrarSesion} />;
};

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
