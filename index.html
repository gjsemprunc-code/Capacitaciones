// ============================================================
// RUT CHILENO
// Solo dígitos; la K se acepta únicamente como verificador final.
// ============================================================
const formatearRut = (valor) => {
    let limpio = valor.replace(/[^0-9kK]/g, "").toUpperCase();
    limpio = limpio.replace(/K(?=.)/g, "");
    if (limpio.length > 9) limpio = limpio.slice(0, 9);
    if (limpio.length <= 1) return limpio;
    return limpio.slice(0, -1) + "-" + limpio.slice(-1);
};

const rutValido = (rut) => {
    const limpio = (rut || "").replace(/[.\-]/g, "").toUpperCase();
    if (!/^[0-9]{7,8}[0-9K]$/.test(limpio)) return false;
    const cuerpo = limpio.slice(0, -1);
    const dv = limpio.slice(-1);
    let suma = 0, mult = 2;
    for (let i = cuerpo.length - 1; i >= 0; i--) {
        suma += parseInt(cuerpo[i], 10) * mult;
        mult = mult === 7 ? 2 : mult + 1;
    }
    const resto = 11 - (suma % 11);
    const dvEsperado = resto === 11 ? "0" : resto === 10 ? "K" : String(resto);
    return dv === dvEsperado;
};

            "Resultados globales del mandato, giros a beneficio del mandante, pérdida de independencia del mandatario, y declaración y pago de impuestos.",
            "Sobre cualquier tema, siempre que quede registrado por escrito.",
            "Solo sobre el monto de la remuneración del mandatario."
        ],
        correcta: 1,
        explicacion: "Se prohíbe al mandatario comunicarse con el mandante para informarle sobre el destino de su patrimonio o pedir instrucciones. Excepcionalmente se permitirán comunicaciones por escrito previamente aprobadas por la respectiva Superintendencia, las que sólo podrán versar sobre resultados globales del mandato, giros a beneficio del mandante, pérdida de la calidad de independiente del mandatario, y declaración y pago de impuestos."
    },
    {
        enunciado: "13. Según el Instructivo Presidencial N°005/2026 sobre el deber de abstención (Art. 12 LBPA), si un funcionario efectivamente incurre en una causal de abstención pero de todas formas interviene y resuelve el asunto, ¿qué ocurre con el acto administrativo dictado?",
        opciones: [
            "El acto es siempre nulo de pleno derecho, sin excepción.",
            "No pasa nada con el acto, porque el deber de abstención es meramente formal.",
            "La infracción no implica necesariamente la invalidez del acto, pero debe ser ponderada fundadamente por la autoridad, y siempre da lugar a responsabilidad administrativa del servidor mediante procedimiento disciplinario.",
            "El acto se invalida automáticamente y el funcionario queda inhabilitado de por vida para la función pública."
        ],
        correcta: 2,
        explicacion: "Por expresa disposición de la ley, la infracción al deber de abstención no implicará, necesariamente, la invalidez de los actos en que hayan intervenido. Sin embargo, el incumplimiento dará lugar a la determinación de responsabilidad del servidor. Frente a la eventual infracción, es obligatorio para el servicio respectivo la instrucción de un procedimiento disciplinario."

]

// ============================================================
// VISTA: CURSO (genérica — sirve para cualquier curso de la BD)
// ============================================================
const Curso = ({ curso, sesion }) => {
    const modulos = curso.modulos || [];
    const preguntas = curso.preguntas || [];

    const [vista, setVista] = useState('registro');
    const [datos, setDatos] = useState({
        nombre: sesion.user.user_metadata.full_name || sesion.user.user_metadata.name || sesion.user.email,
        rut: ''
    });
    const [errores, setErrores] = useState({});
    const [guardando, setGuardando] = useState(false);
    const [moduloActivo, setModuloActivo] = useState(0);
    const [indicePregunta, setIndicePregunta] = useState(0);
    const [respuestas, setRespuestas] = useState([]);
    const [puntaje, setPuntaje] = useState(0);
    const [mostrarExp, setMostrarExp] = useState(false);
    const scrollRef = useRef(null);

    useEffect(() => {
        if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' });
    }, [moduloActivo, indicePregunta, vista]);

    const validar = () => {
        const e = {};
        if (!datos.rut.trim()) e.rut = 'El RUT es obligatorio.';
        else if (!rutValido(datos.rut)) e.rut = 'El RUT no es válido. Revisa el número y el dígito verificador.';
        setErrores(e);
        return Object.keys(e).length === 0;
    };

    const guardarInscripcion = async () => {
        setGuardando(true);
        await supabase.from('inscripciones').upsert({
            user_id: sesion.user.id,
            curso_id: curso.id,
            email: sesion.user.email,
            nombre: datos.nombre,
            rut: datos.rut,
            iniciado_en: new Date().toISOString()
        }, { onConflict: 'user_id,curso_id' });
        setGuardando(false);
    };

    const guardarCertificado = async (pct, aprobado) => {
        await supabase.from('certificados').upsert({
            user_id: sesion.user.id,
            curso_id: curso.id,
            email: sesion.user.email,
            nombre: datos.nombre,
            rut: datos.rut,
            puntaje: pct,
            aprobado: aprobado,
            emitido_en: new Date().toISOString()
        }, { onConflict: 'user_id,curso_id' });
    };

    const enviarRegistro = async (e) => {
        e.preventDefault();
        if (validar()) { await guardarInscripcion(); setVista('bienvenida'); }
    };

    const comenzar = () => {
        setVista('modulos');
        setModuloActivo(curso.video_url ? -1 : 0);
    };

    const siguienteModulo = () => {
        if (moduloActivo < modulos.length - 1) setModuloActivo(moduloActivo + 1);
        else {
            setVista('quiz'); setIndicePregunta(0); setRespuestas([]);
            setPuntaje(0); setMostrarExp(false);
        }
    };

    const anteriorModulo = () => {
        const minimo = curso.video_url ? -1 : 0;
        if (moduloActivo > minimo) setModuloActivo(moduloActivo - 1);
    };

    const responder = (indiceOpcion) => {
        if (mostrarExp) return;
        if (indiceOpcion === preguntas[indicePregunta].correcta) setPuntaje(puntaje + 1);
        const nuevas = [...respuestas];
        nuevas[indicePregunta] = indiceOpcion;
        setRespuestas(nuevas);
        setMostrarExp(true);
    };

    const siguientePregunta = () => {
        setMostrarExp(false);
        if (indicePregunta < preguntas.length - 1) setIndicePregunta(indicePregunta + 1);
        else {
            setVista('resultados');
            const pct = Math.round((puntaje / preguntas.length) * 100);
            guardarCertificado(pct, pct >= 80);
        }
    };

    const registro = () => (
        <div className="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center slide-up w-full max-w-md mx-auto">
            <div className="bg-white p-8 rounded-3xl shadow-2xl border border-gray-100 w-full relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
                <h2 className="text-2xl font-bold text-gray-800 mb-2">Confirma tus datos</h2>
                <p className="text-gray-500 text-sm mb-6">Sesión iniciada como <strong>{sesion.user.email}</strong>. Solo falta tu RUT para emitir el certificado.</p>
                <form onSubmit={enviarRegistro} className="space-y-5 text-left">
                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-1">Nombre Completo</label>
                        <input type="text" value={datos.nombre} readOnly className="w-full px-4 py-3 rounded-xl border border-gray-200 text-gray-500" />
                        <p className="text-xs text-gray-400 mt-1">Este nombre viene de tu cuenta de Google institucional.</p>
                    </div>
                    <div>
                        <label className="block text-sm font-semibold text-gray-700 mb-1">RUT (sin puntos, con guion)</label>
                        <input type="text" inputMode="numeric" autoComplete="off" maxLength={10}
                               value={datos.rut}
                               onChange={(e) => setDatos({...datos, rut: formatearRut(e.target.value)})}
                               placeholder="Ej: 12345678-9"
                               className={`w-full px-4 py-3 rounded-xl border ${errores.rut ? 'border-red-500' : 'border-gray-300'} focus:ring-2 focus:border-blue-500`} />
                        {errores.rut
                            ? <p className="text-red-500 text-xs mt-1">{errores.rut}</p>
                            : <p className="text-xs text-gray-400 mt-1">Solo números. El guion se agrega solo.</p>}
                    </div>
                    <button type="submit" disabled={guardando} className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl mt-4 disabled:opacity-60">
                        {guardando ? 'Guardando…' : <>Continuar <i className="fa-solid fa-arrow-right ml-2"></i></>}
                    </button>
                </form>
            </div>
        </div>
    );

    const bienvenida = () => (
        <div className="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center slide-up">
            <h1 className="text-4xl font-extrabold text-gray-800 mb-2">{curso.titulo}</h1>
            <p className="text-blue-600 font-semibold mb-6">Bienvenido/a, {datos.nombre}</p>
            <p className="text-xl text-gray-600 max-w-3xl mb-8">{curso.descripcion}</p>
            <p className="text-gray-500 mb-8">
                {curso.video_url && <>Incluye un video introductorio y </>}
                {modulos.length} módulo{modulos.length === 1 ? '' : 's'} de contenido,
                más una evaluación de {preguntas.length} pregunta{preguntas.length === 1 ? '' : 's'}.
                Se aprueba con 80%.
            </p>
            <button onClick={comenzar} className="bg-blue-700 hover:bg-blue-800 text-white font-bold py-4 px-10 rounded-full">Comenzar Curso <i className="fa-solid fa-play ml-2"></i></button>
        </div>
    );

    const vistaModulos = () => {
        if (moduloActivo === -1) {
            return (
                <div className="max-w-4xl mx-auto w-full slide-up">
                    <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-8">
                        <h2 className="text-2xl font-bold text-gray-800 mb-4"><i className="fa-solid fa-circle-play text-red-600 mr-2"></i> Video del curso</h2>
                        <div className="bg-black rounded-xl overflow-hidden relative" style={{ paddingBottom: '56.25%', height: 0 }}>
                            <iframe className="absolute top-0 left-0 w-full h-full" src={curso.video_url} frameBorder="0" allowFullScreen></iframe>
                        </div>
                        <div className="mt-8 flex justify-end">
                            <button onClick={siguienteModulo} className="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold">Continuar <i className="fa-solid fa-arrow-right ml-2"></i></button>
                        </div>
                    </div>
                </div>
            );
        }

        const mod = modulos[moduloActivo];
        if (!mod) return null;
        const progreso = ((moduloActivo + 1) / modulos.length) * 100;

        return (
            <div className="max-w-4xl mx-auto w-full slide-up">
                <div className="mb-8">
                    <div className="w-full bg-gray-200 rounded-full h-3"><div className="bg-blue-600 h-3 rounded-full" style={{ width: `${progreso}%` }}></div></div>
                </div>
                <div className="bg-white rounded-2xl shadow-xl border border-gray-100">
                    <div className="bg-slate-800 p-6 flex items-center gap-4">
                        <div className="bg-white/20 p-3 rounded-lg text-white"><i className={`fa-solid ${mod.icono || 'fa-book'} text-3xl`}></i></div>
                        <h2 className="text-2xl font-bold text-white">{mod.titulo}</h2>
                    </div>
                    <div className="p-8 space-y-6">
                        <p className="text-gray-700 text-lg whitespace-pre-line">{mod.teoria}</p>
                        {mod.aplicacion && <div className="bg-blue-50 border-l-4 border-blue-500 p-4"><p className="text-blue-900 italic">{mod.aplicacion}</p></div>}
                        {mod.alerta && (
                            <div className="bg-amber-50 border border-amber-200 p-4 flex gap-4">
                                <i className="fa-solid fa-triangle-exclamation text-amber-500 text-2xl"></i>
                                <p className="text-amber-900 text-sm">{mod.alerta}</p>
                            </div>
                        )}
                    </div>
                    <div className="bg-gray-50 p-5 flex justify-between">
                        <button onClick={anteriorModulo} className="text-blue-600 font-semibold"><i className="fa-solid fa-arrow-left mr-2"></i> Anterior</button>
                        <button onClick={siguienteModulo} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">{moduloActivo === modulos.length - 1 ? 'Iniciar Evaluación' : 'Siguiente'} <i className="fa-solid fa-arrow-right ml-2"></i></button>
                    </div>
                </div>
            </div>
        );
    };

    const vistaQuiz = () => {
        const p = preguntas[indicePregunta];
        const respondida = mostrarExp;
        const acerto = respuestas[indicePregunta] === p.correcta;

        return (
            <div className="max-w-3xl mx-auto w-full slide-up">
                <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-8">
                    <p className="text-sm text-gray-400 mb-2">Pregunta {indicePregunta + 1} de {preguntas.length}</p>
                    <h2 className="text-2xl font-bold text-gray-800 mb-6 leading-relaxed">{p.enunciado}</h2>

                    <div className="space-y-4 mb-8">
                        {p.opciones.map((opt, idx) => {
                            let estilo = "border-gray-200 text-gray-700 hover:border-indigo-400 hover:bg-indigo-50";
                            let icono = null;
                            // Solo se colorea la opción elegida: así quien se equivoca
                            // no descubre cuál era la correcta.
                            if (respondida) {
                                if (idx === respuestas[indicePregunta]) {
                                    if (idx === p.correcta) {
                                        estilo = "border-green-500 bg-green-50 text-green-800 ring-2 ring-green-500 shadow-sm";
                                        icono = <i className="fa-solid fa-circle-check text-green-600 text-xl"></i>;
                                    } else {
                                        estilo = "border-red-500 bg-red-50 text-red-800 ring-2 ring-red-500 shadow-sm";
                                        icono = <i className="fa-solid fa-circle-xmark text-red-600 text-xl"></i>;
                                    }
                                } else {
                                    estilo = "border-gray-200 text-gray-400 opacity-50 cursor-not-allowed";
                                }
                            }
                            return (
                                <button key={idx} onClick={() => responder(idx)} disabled={respondida}
                                        className={`w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex justify-between items-center gap-4 ${estilo}`}>
                                    <span className="leading-relaxed">{opt}</span>
                                    {icono}
                                </button>
                            );
                        })}
                    </div>

                    {respondida && (
                        <div className={`p-5 rounded-lg mb-6 fade-in border-l-4 ${acerto ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
                            <h4 className={`font-bold mb-2 flex items-center ${acerto ? 'text-green-800' : 'text-red-800'}`}>
                                <i className={`fa-solid ${acerto ? 'fa-thumbs-up' : 'fa-circle-exclamation'} mr-2`}></i>
                                {acerto ? '¡Respuesta Correcta!' : 'Respuesta Incorrecta'}
                            </h4>
                            <p className="text-gray-700 text-sm leading-relaxed"><strong>Información Relevante:</strong> {p.explicacion}</p>
                        </div>
                    )}

                    {respondida && (
                        <div className="text-right border-t border-gray-100 pt-6">
                            <button onClick={siguientePregunta} className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-lg font-bold shadow-md transition-all transform hover:-translate-y-0.5">
                                {indicePregunta === preguntas.length - 1 ? 'Ver Resultados Finales' : 'Siguiente Pregunta'} <i className="fa-solid fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const vistaResultados = () => {
        const pct = Math.round((puntaje / preguntas.length) * 100);
        const aprobo = pct >= 80;
        return (
            <div className="max-w-2xl mx-auto w-full text-center slide-up bg-white rounded-3xl shadow-2xl p-10">
                <h2 className="text-4xl font-extrabold mb-4">Resultados</h2>
                <div className={`text-6xl font-black mb-4 ${aprobo ? 'text-green-600' : 'text-red-600'}`}>{pct}%</div>
                {aprobo ? (
                    <>
                        <p className="text-gray-600 mb-8 font-medium">¡Felicitaciones! Has demostrado un nivel de comprensión superior al 80% requerido.</p>
                        <button onClick={() => setVista('certificado')} className="bg-green-600 text-white px-8 py-4 rounded-full font-bold"><i className="fa-solid fa-certificate mr-2"></i> Obtener Certificado</button>
                    </>
                ) : (
                    <>
                        <p className="text-red-600 mb-8 font-medium">No alcanzaste el 80% mínimo de aprobación. Debes volver a realizar el curso.</p>
                        <button onClick={() => { setVista('modulos'); setModuloActivo(curso.video_url ? -1 : 0); setPuntaje(0); setIndicePregunta(0); setMostrarExp(false); setRespuestas([]); }} className="bg-gray-800 text-white px-8 py-4 rounded-full font-bold"><i className="fa-solid fa-rotate-right mr-2"></i> Volver a Iniciar Curso</button>
                    </>
                )}
            </div>
        );
    };

    const vistaCertificado = () => (
        <div className="w-full max-w-4xl mx-auto flex flex-col items-center slide-up pb-10">
            <div className="w-full flex justify-end mb-6 print-hidden">
                <button onClick={() => window.print()} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold shadow"><i className="fa-solid fa-print mr-2"></i> Imprimir / PDF</button>
            </div>
            <div id="certificate-print-area" className="w-full bg-white p-12 border-8 border-double border-blue-900 shadow-2xl text-center certificate-bg">
                <div className="flex justify-center mb-6"><Logo clase="h-24" fallback="text-blue-900 text-5xl" /></div>
                <h1 className="text-5xl font-serif text-gray-800 mb-8 uppercase">Certificado de Aprobación</h1>
                <p className="text-gray-500 uppercase tracking-widest text-sm mb-12">Se otorga a:</p>
                <h2 className="text-4xl font-bold text-blue-900 mb-2">{datos.nombre.toUpperCase()}</h2>
                <p className="text-gray-600 font-medium mb-10 tracking-wider">RUT: {datos.rut}</p>
                <p className="text-lg text-gray-700 leading-relaxed mb-16">Por haber aprobado satisfactoriamente el curso <strong>{curso.titulo}</strong>.</p>
                <div className="text-yellow-500 text-6xl drop-shadow-md"><i className="fa-solid fa-certificate"></i></div>
            </div>
        </div>
    );

    return (
        <div className="min-h-screen flex flex-col h-screen overflow-hidden">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center print-hidden">
                <a href="#/" className="font-bold hover:text-blue-300 flex items-center gap-3">
                    <Logo clase="h-12 logo-cabecera" fallback="text-white text-xl" />
                    <span><i className="fa-solid fa-arrow-left mr-2"></i>Portal de Capacitación</span>
                </a>
                <span className="text-sm bg-slate-800 px-3 py-1 rounded-full">{sesion.user.email}</span>
            </header>
            <main ref={scrollRef} className="flex-grow overflow-y-auto p-4 md:p-8 flex items-start justify-center scrollbar-hide">
                {vista === 'registro' && registro()}
                {vista === 'bienvenida' && bienvenida()}
                {vista === 'modulos' && vistaModulos()}
                {vista === 'quiz' && vistaQuiz()}
                {vista === 'resultados' && vistaResultados()}
                {vista === 'certificado' && vistaCertificado()}
            </main>
        </div>
    );
};

// ============================================================
// FORMULARIO DE CURSO (solo administradores)
// ============================================================
const FormularioCurso = ({ cursoInicial, onGuardado, onCancelar, sesion }) => {
    const nuevo = !cursoInicial;
    const [c, setC] = useState(cursoInicial || {
        id: "", titulo: "", descripcion: "", icono: "fa-book",
        color: "bg-blue-600", video_url: "", publicado: false, orden: 0,
        modulos: [], preguntas: []
    });
    const [guardando, setGuardando] = useState(false);
    const [error, setError] = useState("");

    const set = (campo, valor) => setC({ ...c, [campo]: valor });

    // --- módulos ---
    const agregarModulo = () => set("modulos", [...(c.modulos || []),
        { titulo: "", icono: "fa-book", teoria: "", aplicacion: "", alerta: "" }]);
    const editarModulo = (i, campo, valor) => {
        const m = [...c.modulos]; m[i] = { ...m[i], [campo]: valor }; set("modulos", m);
    };
    const borrarModulo = (i) => set("modulos", c.modulos.filter((_, j) => j !== i));
    const moverModulo = (i, dir) => {
        const m = [...c.modulos]; const k = i + dir;
        if (k < 0 || k >= m.length) return;
        [m[i], m[k]] = [m[k], m[i]]; set("modulos", m);
    };

    // --- preguntas ---
    const agregarPregunta = () => set("preguntas", [...(c.preguntas || []),
        { enunciado: "", opciones: ["", "", "", ""], correcta: 0, explicacion: "" }]);
    const editarPregunta = (i, campo, valor) => {
        const p = [...c.preguntas]; p[i] = { ...p[i], [campo]: valor }; set("preguntas", p);
    };
    const editarOpcion = (i, j, valor) => {
        const p = [...c.preguntas]; const o = [...p[i].opciones];
        o[j] = valor; p[i] = { ...p[i], opciones: o }; set("preguntas", p);
    };
    const borrarPregunta = (i) => set("preguntas", c.preguntas.filter((_, j) => j !== i));

    const guardar = async () => {
        setError("");
        const id = (c.id || "").trim().toLowerCase().replace(/[^a-z0-9-]/g, "-");
        if (!id) return setError("Falta el identificador del curso.");
        if (!c.titulo.trim()) return setError("Falta el título del curso.");
        if (!c.preguntas || c.preguntas.length === 0) return setError("El curso necesita al menos una pregunta de evaluación.");
        for (const p of c.preguntas) {
            if (!p.enunciado.trim()) return setError("Hay una pregunta sin enunciado.");
            if (p.opciones.filter(o => o.trim()).length < 2) return setError("Cada pregunta necesita al menos dos alternativas.");
        }

        setGuardando(true);
        const fila = {
            id, titulo: c.titulo, descripcion: c.descripcion,
            icono: c.icono, color: c.color, video_url: c.video_url || null,
            modulos: c.modulos || [], preguntas: c.preguntas || [],
            publicado: !!c.publicado, orden: parseInt(c.orden, 10) || 0,
            creado_por: sesion.user.id, editado_en: new Date().toISOString()
        };
        const { error: err } = await supabase.from("cursos").upsert(fila, { onConflict: "id" });
        setGuardando(false);
        if (err) setError("No se pudo guardar: " + err.message);
        else onGuardado();
    };

    const campo = "w-full px-3 py-2 rounded-lg border border-gray-300 text-sm";

    return (
        <div className="bg-white rounded-2xl shadow-md p-6 md:p-8 space-y-8">
            <div className="flex justify-between items-center">
                <h3 className="text-xl font-bold text-gray-800">{nuevo ? "Nuevo curso" : "Editar curso"}</h3>
                <button onClick={onCancelar} className="text-gray-500 text-sm hover:text-gray-700"><i className="fa-solid fa-xmark mr-1"></i>Cancelar</button>
            </div>

            {/* Datos generales */}
            <section className="space-y-4">
                <h4 className="font-semibold text-gray-700 border-b border-gray-100 pb-2">Datos generales</h4>
                <div className="grid md:grid-cols-2 gap-4">
                    <div>
                        <label className="block text-xs font-semibold text-gray-600 mb-1">Identificador (sin espacios)</label>
                        <input className={campo} value={c.id} disabled={!nuevo}
                               onChange={e => set("id", e.target.value)} placeholder="ej: ciberseguridad-2026" />
                        <p className="text-xs text-gray-400 mt-1">{nuevo ? "Se usa en la dirección del curso. No se puede cambiar después." : "No editable."}</p>
                    </div>
                    <div>
                        <label className="block text-xs font-semibold text-gray-600 mb-1">Orden en el portal</label>
                        <input className={campo} type="number" value={c.orden} onChange={e => set("orden", e.target.value)} />
                    </div>
                </div>
                <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Título</label>
                    <input className={campo} value={c.titulo} onChange={e => set("titulo", e.target.value)} />
                </div>
                <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Descripción</label>
                    <textarea className={campo} rows="2" value={c.descripcion || ""} onChange={e => set("descripcion", e.target.value)} />
                </div>
                <div>
                    <label className="block text-xs font-semibold text-gray-600 mb-1">Enlace del video (opcional)</label>
                    <input className={campo} value={c.video_url || ""} onChange={e => set("video_url", e.target.value)}
                           placeholder="https://drive.google.com/file/d/.../preview" />
                    <p className="text-xs text-gray-400 mt-1">En Google Drive, usa el enlace terminado en /preview. En YouTube, el que dice /embed/.</p>
                </div>
                <div className="grid md:grid-cols-2 gap-4">
                    <div>
                        <label className="block text-xs font-semibold text-gray-600 mb-1">Ícono</label>
                        <div className="flex flex-wrap gap-2">
                            {ICONOS.map(ic => (
                                <button key={ic} onClick={() => set("icono", ic)} type="button"
                                        className={`w-9 h-9 rounded-lg border-2 ${c.icono === ic ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-gray-200 text-gray-400'}`}>
                                    <i className={`fa-solid ${ic}`}></i>
                                </button>
                            ))}
                        </div>
                    </div>
                    <div>
                        <label className="block text-xs font-semibold text-gray-600 mb-1">Color</label>
                        <div className="flex flex-wrap gap-2">
                            {COLORES.map(col => (
                                <button key={col.valor} onClick={() => set("color", col.valor)} type="button" title={col.nombre}
                                        className={`w-9 h-9 rounded-lg ${col.valor} ${c.color === col.valor ? 'ring-2 ring-offset-2 ring-slate-800' : ''}`}></button>
                            ))}
                        </div>
                    </div>
                </div>
                <label className="flex items-center gap-2 text-sm text-gray-700">
                    <input type="checkbox" checked={!!c.publicado} onChange={e => set("publicado", e.target.checked)} />
                    Publicado (visible para todos los funcionarios)
                </label>
            </section>

            {/* Módulos */}
            <section className="space-y-4">
                <div className="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h4 className="font-semibold text-gray-700">Módulos de contenido ({(c.modulos || []).length})</h4>
                    <button onClick={agregarModulo} type="button" className="text-blue-600 text-sm font-semibold"><i className="fa-solid fa-plus mr-1"></i>Agregar módulo</button>
                </div>
                {(c.modulos || []).map((m, i) => (
                    <div key={i} className="border border-gray-200 rounded-xl p-4 space-y-3">
                        <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-gray-400">MÓDULO {i + 1}</span>
                            <div className="flex gap-3 text-sm">
                                <button onClick={() => moverModulo(i, -1)} type="button" className="text-gray-400 hover:text-gray-700"><i className="fa-solid fa-arrow-up"></i></button>
                                <button onClick={() => moverModulo(i, 1)} type="button" className="text-gray-400 hover:text-gray-700"><i className="fa-solid fa-arrow-down"></i></button>
                                <button onClick={() => borrarModulo(i)} type="button" className="text-red-500 hover:text-red-700"><i className="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                        <input className={campo} placeholder="Título del módulo" value={m.titulo} onChange={e => editarModulo(i, "titulo", e.target.value)} />
                        <textarea className={campo} rows="4" placeholder="Contenido principal" value={m.teoria} onChange={e => editarModulo(i, "teoria", e.target.value)} />
                        <textarea className={campo} rows="2" placeholder="Ejemplo o aplicación práctica (opcional)" value={m.aplicacion || ""} onChange={e => editarModulo(i, "aplicacion", e.target.value)} />
                        <textarea className={campo} rows="2" placeholder="Nota de advertencia (opcional)" value={m.alerta || ""} onChange={e => editarModulo(i, "alerta", e.target.value)} />
                    </div>
                ))}
            </section>

            {/* Preguntas */}
            <section className="space-y-4">
                <div className="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h4 className="font-semibold text-gray-700">Evaluación ({(c.preguntas || []).length} preguntas)</h4>
                    <button onClick={agregarPregunta} type="button" className="text-blue-600 text-sm font-semibold"><i className="fa-solid fa-plus mr-1"></i>Agregar pregunta</button>
                </div>
                {(c.preguntas || []).map((p, i) => (
                    <div key={i} className="border border-gray-200 rounded-xl p-4 space-y-3">
                        <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-gray-400">PREGUNTA {i + 1}</span>
                            <button onClick={() => borrarPregunta(i)} type="button" className="text-red-500 hover:text-red-700 text-sm"><i className="fa-solid fa-trash"></i></button>
                        </div>
                        <textarea className={campo} rows="2" placeholder="Enunciado de la pregunta" value={p.enunciado} onChange={e => editarPregunta(i, "enunciado", e.target.value)} />
                        <p className="text-xs text-gray-500">Marca el círculo de la alternativa correcta:</p>
                        {p.opciones.map((o, j) => (
                            <div key={j} className="flex items-center gap-2">
                                <input type="radio" name={`correcta-${i}`} checked={p.correcta === j} onChange={() => editarPregunta(i, "correcta", j)} />
                                <input className={campo} placeholder={`Alternativa ${j + 1}`} value={o} onChange={e => editarOpcion(i, j, e.target.value)} />
                            </div>
                        ))}
                        <textarea className={campo} rows="2" placeholder="Explicación que se muestra tras responder" value={p.explicacion || ""} onChange={e => editarPregunta(i, "explicacion", e.target.value)} />
                    </div>
                ))}
            </section>

            {error && <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3">{error}</div>}

            <div className="flex justify-end gap-3 border-t border-gray-100 pt-5">
                <button onClick={onCancelar} type="button" className="px-5 py-2 rounded-lg text-gray-600 font-semibold">Cancelar</button>
                <button onClick={guardar} disabled={guardando} type="button" className="bg-blue-700 hover:bg-blue-800 text-white px-6 py-2 rounded-lg font-bold disabled:opacity-60">
                    {guardando ? "Guardando…" : "Guardar curso"}
                </button>
            </div>
        </div>
    );
};

// ============================================================
// VISTA: PANEL DE ADMINISTRADOR
// ============================================================
const PanelAdmin = ({ sesion, esAdmin, cursos, recargarCursos }) => {
    const [pestana, setPestana] = useState("inscritos");
    const [inscripciones, setInscripciones] = useState([]);
    const [certificados, setCertificados] = useState([]);
    const [filtroCurso, setFiltroCurso] = useState("todos");
    const [cargando, setCargando] = useState(true);
    const [editando, setEditando] = useState(null);   // null | {} | curso
    const [aviso, setAviso] = useState("");

    useEffect(() => {
        if (!esAdmin) { setCargando(false); return; }
        (async () => {
            const [{ data: insc }, { data: certs }] = await Promise.all([
                supabase.from("inscripciones").select("*").order("iniciado_en", { ascending: false }),
                supabase.from("certificados").select("*").order("emitido_en", { ascending: false })
            ]);
            setInscripciones(insc || []);
            setCertificados(certs || []);
            setCargando(false);
        })();
    }, [esAdmin]);

    if (!esAdmin) {
        return (
            <div className="min-h-screen flex items-center justify-center p-6">
                <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md text-center">
                    <div className="text-red-500 text-4xl mb-4"><i className="fa-solid fa-lock"></i></div>
                    <h1 className="text-xl font-bold mb-2">Sin acceso de administrador</h1>
                    <p className="text-gray-500 mb-6">Tu cuenta no tiene permisos para ver este panel.</p>
                    <a href="#/" className="text-blue-600 font-semibold"><i className="fa-solid fa-arrow-left mr-2"></i>Volver al portal</a>
                </div>
            </div>
        );
    }

    const nombreCurso = (id) => {
        const c = cursos.find(c => c.id === id);
        return c ? c.titulo : id;
    };

    const cursosConDatos = [...new Set(inscripciones.map(i => i.curso_id))];
    const inscFiltradas = filtroCurso === "todos" ? inscripciones : inscripciones.filter(i => i.curso_id === filtroCurso);
    const certificadoDe = (userId, cursoId) => certificados.find(c => c.user_id === userId && c.curso_id === cursoId);

    const enBaseDeDatos = cursos.filter(c => !c.esSemilla);
    const semillaPendiente = cursos.some(c => c.esSemilla);

    const importarSemilla = async () => {
        setAviso("");
        const { esSemilla, ...fila } = CURSO_SEMILLA;
        const { error } = await supabase.from("cursos").upsert({ ...fila, creado_por: sesion.user.id }, { onConflict: "id" });
        if (error) setAviso("No se pudo importar: " + error.message);
        else { setAviso("Curso importado. Ahora puedes editarlo."); await recargarCursos(); }
    };

    const eliminarCurso = async (curso) => {
        if (!window.confirm(`¿Eliminar "${curso.titulo}"? Las inscripciones y certificados ya emitidos NO se borran.`)) return;
        const { error } = await supabase.from("cursos").delete().eq("id", curso.id);
        if (error) setAviso("No se pudo eliminar: " + error.message);
        else { setAviso("Curso eliminado."); await recargarCursos(); }
    };

    const alternarPublicado = async (curso) => {
        const { error } = await supabase.from("cursos").update({ publicado: !curso.publicado }).eq("id", curso.id);
        if (error) setAviso("No se pudo actualizar: " + error.message);
        else await recargarCursos();
    };

    return (
        <div className="min-h-screen">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center">
                <a href="#/" className="font-bold hover:text-blue-300 flex items-center gap-3">
                    <Logo clase="h-12 logo-cabecera" fallback="text-white text-xl" />
                    <span><i className="fa-solid fa-arrow-left mr-2"></i>Panel de Administrador</span>
                </a>
            </header>

            <main className="max-w-6xl mx-auto p-6 md:p-10">
                <div className="flex gap-2 mb-6">
                    <button onClick={() => setPestana("inscritos")}
                            className={`px-4 py-2 rounded-lg font-semibold text-sm ${pestana === 'inscritos' ? 'bg-blue-700 text-white' : 'bg-white text-gray-600'}`}>
                        <i className="fa-solid fa-users mr-2"></i>Inscritos
                    </button>
                    <button onClick={() => { setPestana("cursos"); setEditando(null); }}
                            className={`px-4 py-2 rounded-lg font-semibold text-sm ${pestana === 'cursos' ? 'bg-blue-700 text-white' : 'bg-white text-gray-600'}`}>
                        <i className="fa-solid fa-book mr-2"></i>Cursos
                    </button>
                </div>

                {aviso && <div className="bg-blue-50 border border-blue-200 text-blue-800 text-sm rounded-lg p-3 mb-4">{aviso}</div>}

                {pestana === "inscritos" && (
                    <>
                        <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Inscritos y certificados</h2>
                            <select value={filtroCurso} onChange={e => setFiltroCurso(e.target.value)} className="border border-gray-300 rounded-lg px-3 py-2 text-sm">
                                <option value="todos">Todos los cursos</option>
                                {cursosConDatos.map(id => <option key={id} value={id}>{nombreCurso(id)}</option>)}
                            </select>
                        </div>
                        <div className="bg-white rounded-2xl shadow-md overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead className="bg-gray-50 text-gray-500 uppercase text-xs">
                                    <tr>
                                        <th className="text-left px-4 py-3">Nombre</th>
                                        <th className="text-left px-4 py-3">Correo</th>
                                        <th className="text-left px-4 py-3">RUT</th>
                                        <th className="text-left px-4 py-3">Curso</th>
                                        <th className="text-left px-4 py-3">Inscrito</th>
                                        <th className="text-left px-4 py-3">Resultado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {inscFiltradas.map(i => {
                                        const cert = certificadoDe(i.user_id, i.curso_id);
                                        return (
                                            <tr key={i.id} className="border-t border-gray-100">
                                                <td className="px-4 py-3 font-medium text-gray-800">{i.nombre}</td>
                                                <td className="px-4 py-3 text-gray-500">{i.email}</td>
                                                <td className="px-4 py-3 text-gray-500">{i.rut}</td>
                                                <td className="px-4 py-3 text-gray-500">{nombreCurso(i.curso_id)}</td>
                                                <td className="px-4 py-3 text-gray-500">{new Date(i.iniciado_en).toLocaleDateString("es-CL")}</td>
                                                <td className="px-4 py-3">
                                                    {!cert && <span className="text-gray-400">En curso</span>}
                                                    {cert && cert.aprobado && <span className="text-green-600 font-semibold"><i className="fa-solid fa-circle-check mr-1"></i>Aprobado ({cert.puntaje}%)</span>}
                                                    {cert && !cert.aprobado && <span className="text-red-500 font-semibold"><i className="fa-solid fa-circle-xmark mr-1"></i>Reprobado ({cert.puntaje}%)</span>}
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {!cargando && inscFiltradas.length === 0 && (
                                        <tr><td colSpan="6" className="px-4 py-10 text-center text-gray-400">Aún no hay inscritos.</td></tr>
                                    )}
                                    {cargando && <tr><td colSpan="6" className="px-4 py-10 text-center text-gray-400">Cargando…</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </>
                )}

                {pestana === "cursos" && !editando && (
                    <>
                        <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Cursos</h2>
                            <button onClick={() => setEditando({})} className="bg-blue-700 hover:bg-blue-800 text-white px-5 py-2 rounded-lg font-bold text-sm">
                                <i className="fa-solid fa-plus mr-2"></i>Nuevo curso
                            </button>
                        </div>

                        {semillaPendiente && (
                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 flex flex-wrap items-center justify-between gap-3">
                                <p className="text-amber-900 text-sm">
                                    El curso de Probidad todavía está escrito dentro del archivo. Impórtalo a la base de datos para poder editarlo desde aquí.
                                </p>
                                <button onClick={importarSemilla} className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-bold whitespace-nowrap">
                                    <i className="fa-solid fa-download mr-2"></i>Importar
                                </button>
                            </div>
                        )}

                        <div className="grid sm:grid-cols-2 gap-4">
                            {enBaseDeDatos.map(curso => (
                                <div key={curso.id} className="bg-white rounded-2xl shadow-md p-5">
                                    <div className="flex items-start gap-4 mb-3">
                                        <div className={`${curso.color} text-white w-10 h-10 rounded-lg flex items-center justify-center shrink-0`}>
                                            <i className={`fa-solid ${curso.icono}`}></i>
                                        </div>
                                        <div className="min-w-0">
                                            <h3 className="font-bold text-gray-800 leading-tight">{curso.titulo}</h3>
                                            <p className="text-xs text-gray-400 mt-1">{curso.id}</p>
                                        </div>
                                    </div>
                                    <p className="text-xs text-gray-500 mb-4">
                                        {(curso.modulos || []).length} módulos · {(curso.preguntas || []).length} preguntas
                                    </p>
                                    <div className="flex flex-wrap items-center gap-3 text-sm">
                                        <button onClick={() => alternarPublicado(curso)}
                                                className={`px-3 py-1 rounded-full text-xs font-bold ${curso.publicado ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>
                                            <i className={`fa-solid ${curso.publicado ? 'fa-eye' : 'fa-eye-slash'} mr-1`}></i>
                                            {curso.publicado ? 'Publicado' : 'Borrador'}
                                        </button>
                                        <button onClick={() => setEditando(curso)} className="text-blue-600 font-semibold"><i className="fa-solid fa-pen mr-1"></i>Editar</button>
                                        <button onClick={() => eliminarCurso(curso)} className="text-red-500 font-semibold"><i className="fa-solid fa-trash mr-1"></i>Eliminar</button>
                                    </div>
                                </div>
                            ))}
                            {enBaseDeDatos.length === 0 && (
                                <p className="text-gray-400 text-sm col-span-2 py-8 text-center">Todavía no hay cursos en la base de datos.</p>
                            )}
                        </div>
                    </>
                )}

                {pestana === "cursos" && editando && (
                    <FormularioCurso
                        cursoInicial={editando.id ? editando : null}
                        sesion={sesion}
                        onCancelar={() => setEditando(null)}
                        onGuardado={async () => { setEditando(null); setAviso("Curso guardado."); await recargarCursos(); }}
                    />
                )}
            </main>
        </div>
    );
};

    return (
        <div className="min-h-screen">
            <header className="bg-slate-900 text-white px-6 py-3 flex justify-between items-center">
                <h1 className="font-bold flex items-center gap-3">
                    <Logo clase="h-14 logo-cabecera" fallback="text-white text-xl" />
                    Portal de Capacitación
                </h1>
                <div className="flex items-center gap-4 text-sm">
                    <span className="hidden sm:inline text-slate-300">{sesion.user.email}</span>
                    {esAdmin && (
                        <a href="#/admin" className="bg-blue-700 hover:bg-blue-600 px-3 py-1.5 rounded-full">
                            <i className="fa-solid fa-gauge mr-1"></i>Panel admin

                </div>
            </header>

            <main className="max-w-5xl mx-auto p-6 md:p-10">
                <h2 className="text-2xl font-bold text-gray-800 mb-1">Cursos disponibles</h2>
                <p className="text-gray-500 mb-8">Bienvenido/a, {sesion.user.user_metadata.full_name || sesion.user.email}.</p>

                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    {visibles.map(curso => (
                        <a key={curso.id} href={`#/curso/${curso.id}`} className="bg-white rounded-2xl shadow-md hover:shadow-xl transition-shadow p-6 flex flex-col fade-in">
                            <div className={`${curso.color} text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl mb-4`}>
                                <i className={`fa-solid ${curso.icono}`}></i>
                            </div>

                            <p className="text-sm text-gray-500 flex-grow">{curso.descripcion}</p>

                        </a>
                    ))}
                    {visibles.length === 0 && (
                        <p className="text-gray-400 col-span-3 py-10 text-center">No hay cursos publicados por ahora.</p>
                    )}
                </div>
            </main>
        </div>
    );
};

            <div className="flex justify-center mb-5"><Logo clase="h-20" fallback="text-blue-600 text-5xl" /></div>
            <h1 className="text-2xl font-bold mb-2">Portal de Capacitación</h1>
            <p className="text-gray-500 mb-8">Ministerio de Ciencia, Tecnología, Conocimiento e Innovación</p>

            {errorDominio && (
                <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-4 mb-6 text-left">
                    <i className="fa-solid fa-circle-exclamation mr-2"></i>
                    Esa cuenta de Google no pertenece al dominio <strong>@{DOMINIO}</strong>. Inicia sesión con tu correo institucional.
                </div>
            )}

            <button onClick={onIngresar} className="w-full flex items-center justify-center gap-3 border-2 border-gray-200 hover:border-gray-300 rounded-xl py-3 font-semibold text-gray-700 transition-colors">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.4l-6.3-5.3C29.4 35 26.8 36 24 36c-5.4 0-9.9-3.4-11.5-8.2l-6.5 5C9.6 39.5 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C39.9 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
                Ingresar con Google
            </button>
            <p className="text-xs text-gray-400 mt-6">Acceso exclusivo para funcionarios con correo @{DOMINIO}</p>
        </div>
    </div>
);

// ============================================================
// APLICACIÓN
//   #/                → portal
//   #/curso/<id>      → curso
//   #/admin           → panel de administrador
// ============================================================
function leerRuta() {
    const h = (window.location.hash || "").replace(/^#/, "");
    if (h.startsWith("/curso/")) return { vista: "curso", cursoId: h.slice("/curso/".length) };
    if (h === "/admin") return { vista: "admin" };
    return { vista: "portal" };
}

const App = () => {
    const [cargando, setCargando] = useState(true);
    const [sesion, setSesion] = useState(null);
    const [errorDominio, setErrorDominio] = useState(false);
    const [esAdmin, setEsAdmin] = useState(false);
    const [cursos, setCursos] = useState([]);
    const [ruta, setRuta] = useState(leerRuta());

    useEffect(() => {
        const alCambiarHash = () => setRuta(leerRuta());
        window.addEventListener("hashchange", alCambiarHash);
        return () => window.removeEventListener("hashchange", alCambiarHash);
    }, []);

    // Carga los cursos desde la base de datos. Si el curso semilla no
    // está guardado todavía, se agrega igual para que el portal nunca
    // quede vacío mientras se hace la migración.
    const cargarCursos = async () => {
        const { data, error } = await supabase.from("cursos").select("*").order("orden");
        const lista = (!error && data) ? data : [];
        if (!lista.some(c => c.id === CURSO_SEMILLA.id)) {
            lista.push({ ...CURSO_SEMILLA, esSemilla: true });
        }
        setCursos(lista);
    };

    useEffect(() => {
        supabase.auth.getSession().then(({ data }) => {
            manejarSesion(data.session);
            setCargando(false);
        });
        const { data: listener } = supabase.auth.onAuthStateChange((_e, session) => manejarSesion(session));
        return () => listener.subscription.unsubscribe();
    }, []);

    const manejarSesion = async (session) => {
        if (!session) { setSesion(null); return; }

        const email = session.user.email || "";
        if (!esCorreoValido(email)) {
            // Defensa en el cliente. La real está en la base de datos.
            setErrorDominio(true);
            await supabase.auth.signOut();
            setSesion(null);
            return;
        }
        setErrorDominio(false);
        setSesion(session);

        await supabase.from("perfiles").upsert({
            id: session.user.id,
            email: email,
            nombre_completo: session.user.user_metadata.full_name || session.user.user_metadata.name || "",
            ultimo_ingreso: new Date().toISOString()
        });

        const { data: perfil } = await supabase.from("perfiles").select("es_admin").eq("id", session.user.id).single();
        setEsAdmin(!!(perfil && perfil.es_admin));
        await cargarCursos();
    };

    const cerrarSesion = async () => {
        await supabase.auth.signOut();
        setSesion(null);
        irA("#/");
    };

    if (cargando) return <div className="min-h-screen flex items-center justify-center text-gray-400">Cargando…</div>;
    if (!sesion) return <Login errorDominio={errorDominio} onIngresar={() => {
        setErrorDominio(false);
        supabase.auth.signInWithOAuth({
            provider: "google",
            options: {
                queryParams: { hd: DOMINIO, prompt: "select_account" },
                redirectTo: window.location.href.split("#")[0]
            }
        });
    }} />;

    if (ruta.vista === "admin") {
        return <PanelAdmin sesion={sesion} esAdmin={esAdmin} cursos={cursos} recargarCursos={cargarCursos} />;
    }

    if (ruta.vista === "curso") {
        const curso = cursos.find(c => c.id === ruta.cursoId);
        if (!curso) {
            return (
                <div className="min-h-screen flex items-center justify-center p-6 text-center">
                    <div className="bg-white p-10 rounded-3xl shadow-xl max-w-md">
                        <div className="text-gray-300 text-4xl mb-4"><i className="fa-solid fa-circle-question"></i></div>
                        <h1 className="text-xl font-bold mb-2">Curso no encontrado</h1>
                        <p className="text-gray-500 mb-6">Puede que haya sido eliminado o aún no esté publicado.</p>
                        <a href="#/" className="text-blue-600 font-semibold"><i className="fa-solid fa-arrow-left mr-2"></i>Volver al portal</a>
                    </div>
                </div>
            );
        }
        return <Curso key={curso.id} curso={curso} sesion={sesion} />;
    }

    return <Portal sesion={sesion} esAdmin={esAdmin} cursos={cursos} onCerrarSesion={cerrarSesion} />;
};

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
